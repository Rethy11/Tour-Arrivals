name: Deploy Tour Arrivals

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare deploy folder
        run: |
          # Build the deploy copy OUTSIDE the checkout dir. Doing
          # `cp -r . _site` while _site lives inside "." makes cp try to
          # copy _site into itself, which fails (exit 1) and — since
          # Actions runs steps with `bash -e` — silently kills this step
          # and every step after it, so the placeholder injection below
          # never runs and nothing new ever deploys.
          mkdir -p /tmp/_site
          cp -r . /tmp/_site
          rm -rf /tmp/_site/.git /tmp/_site/.github

      - name: Inject config from secrets
        env:
          TOUR_MT_NAME: ${{ secrets.TOUR_MT_NAME }}
          TOUR_JTJ_NAME: ${{ secrets.TOUR_JTJ_NAME }}
          TOUR_BABM_NAME: ${{ secrets.TOUR_BABM_NAME }}
          TOUR_GA_NAME: ${{ secrets.TOUR_GA_NAME }}
          BUSINESS_FILE_SUFFIX: ${{ secrets.BUSINESS_FILE_SUFFIX }}
          FUZZY_MATCH_TERM: ${{ secrets.FUZZY_MATCH_TERM }}
        run: |
          python3 - <<'PYEOF'
          import os, sys

          path = "/tmp/_site/index.html"
          with open(path, encoding="utf-8") as f:
              content = f.read()

          required = [
              "TOUR_MT_NAME", "TOUR_JTJ_NAME", "TOUR_BABM_NAME", "TOUR_GA_NAME",
              "BUSINESS_FILE_SUFFIX", "FUZZY_MATCH_TERM",
          ]

          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              print(f"::error::Missing or empty repository secret(s): {', '.join(missing)}")
              sys.exit(1)

          for name in required:
              token = "${" + name + "}"
              value = os.environ[name]
              if token not in content:
                  print(f"::warning::Placeholder {token} not found in index.html (already replaced, or file changed).")
              content = content.replace(token, value)

          with open(path, "w", encoding="utf-8") as f:
              f.write(content)

          print("Config injected successfully.")
          PYEOF

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
